<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無法連線｜公股銀行考題練習</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#1f2933;
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
  .card{max-width:420px;background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:20px}
  h1{font-size:20px;margin:0 0 8px}
  li{margin:4px 0}
  button{margin-top:12px;background:#1f5f8b;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <img src="/icons/icon-192.png" width="56" height="56" alt="">
  <h1>暫時連不到電腦上的題庫</h1>
  <p>題庫與作答紀錄存在你的電腦上，需要連線才能使用。請確認：</p>
  <ul>
    <li>電腦已執行 <code>npm run lan</code></li>
    <li>手機與電腦在同一個 Wi‑Fi</li>
    <li>電腦沒有進入睡眠</li>
  </ul>
  <button onclick="location.reload()">重新連線</button>
</div>
</body>
</html>
