<title>FIT重點複習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 版面：頂部固定列＋單欄閱讀（最寬 760px），章節頁以分頁切換「重點／記憶卡／練習題」 */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --sunk: #e9ece7;
  --fg: #1c2420;
  --muted: #5b665f;
  --line: #d6dbd4;
  --accent: #2d5f4a;
  --accent-ink: #ffffff;
  --accent-soft: #e1ece5;
  --good: #1f7a4a; --good-soft: #e2f3e8;
  --bad: #b23a2e; --bad-soft: #fae8e5;
  --pending: #8a5b00; --pending-soft: #fbf0d6;
  --acc: #2f5d8a; --mb: #6a4c93; --ni: #a0522d; --ba: #2d6a6a; --aml: #8b3a62; --pre: #5c6b1f;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201c; --sunk: #212a25; --fg: #e5ebe7; --muted: #9eaba3; --line: #2f3a34;
    --accent: #7cc4a2; --accent-ink: #0d1a14; --accent-soft: #1f3329;
    --good: #6fd39b; --good-soft: #17301f; --bad: #f08c80; --bad-soft: #3a201c;
    --pending: #e8c066; --pending-soft: #33290f;
    --acc: #86b4e3; --mb: #b9a0e3; --ni: #e3a07c; --ba: #7cc9c9; --aml: #e39bc0; --pre: #c3d37a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --sunk: #212a25; --fg: #e5ebe7; --muted: #9eaba3; --line: #2f3a34;
  --accent: #7cc4a2; --accent-ink: #0d1a14; --accent-soft: #1f3329;
  --good: #6fd39b; --good-soft: #17301f; --bad: #f08c80; --bad-soft: #3a201c;
  --pending: #e8c066; --pending-soft: #33290f;
  --acc: #86b4e3; --mb: #b9a0e3; --ni: #e3a07c; --ba: #7cc9c9; --aml: #e39bc0; --pre: #c3d37a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--fg); text-decoration: none; white-space: nowrap; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-left: auto; scrollbar-width: none; min-width: 0; }
.themebtn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
.themebtn:hover { background: var(--sunk); }
.themes { display: flex; flex-wrap: wrap; gap: 8px; }
.themes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav.tabs a { padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); white-space: nowrap; font-size: 14px; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
main { padding-block: 20px 64px; display: grid; gap: 16px; }
h1 { font-family: var(--font-display); font-size: 24px; line-height: 1.35; margin: 0; text-wrap: balance; }
h2 { font-size: 18px; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; letter-spacing: .02em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--fg); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.chip.pending { background: var(--pending-soft); color: var(--pending); border-color: transparent; font-weight: 700; }
.chip.self { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.pass { background: var(--good-soft); color: var(--good); border-color: transparent; font-weight: 700; }
.chip.fail { background: var(--bad-soft); color: var(--bad); border-color: transparent; font-weight: 700; }
.passbox { margin: 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--fg); }
.passbox.pass { background: var(--good-soft); }
.passbox.fail { background: var(--bad-soft); }
.passbox b { font-size: 16px; margin-right: 6px; }
.passbox.pass b { color: var(--good); }
.passbox.fail b { color: var(--bad); }
.subject { border-top: 4px solid var(--subj); }
.subject h2 { color: var(--subj); font-family: var(--font-display); font-size: 20px; }
.chlist { display: grid; gap: 8px; }
.chlink { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--fg); background: var(--surface); }
.chlink:hover { border-color: var(--subj); }
.chlink .n { font-variant-numeric: tabular-nums; color: var(--subj); font-weight: 700; }
.chlink .arrow { margin-left: auto; color: var(--muted); }
.crumb { font-size: 13px; color: var(--muted); }
.crumb a { color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; cursor: pointer; font-weight: 500; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.sec { display: grid; gap: 8px; }
.sec h3 { display: flex; align-items: center; gap: 8px; }
.sec h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--subj, var(--accent)); }
.point { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 12px; background: var(--sunk); border-radius: 10px; }
.point .txt { min-width: 0; }
.point .star { border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 4px; color: var(--muted); }
.point .star[aria-pressed="true"] { color: #d4a017; }
.src { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.flip { perspective: 1000px; }
.flip button.cardbtn { position: relative; width: 100%; min-height: 170px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.face { position: absolute; inset: 0; border-radius: var(--radius); border: 1px solid var(--line); padding: 18px; display: grid; place-content: center; gap: 8px; text-align: center; backface-visibility: hidden; transition: transform .45s ease; background: var(--surface); }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); }
.flip.on .face.front { transform: rotateY(180deg); }
.flip.on .face.back { transform: rotateY(360deg); }
.face .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.face .q { font-size: 18px; font-weight: 700; }
.face .a { font-size: 16px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.opt b { flex: none; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.explain { background: var(--sunk); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.verdict.ok { color: var(--good); font-weight: 700; }
.verdict.no { color: var(--bad); font-weight: 700; }
.note { padding: 10px 12px; border-radius: 10px; background: var(--pending-soft); color: var(--fg); font-size: 14px; }
.syncnote { font-size: 12px; color: var(--muted); }
.empty { padding: 20px; text-align: center; color: var(--muted); }
.progress { font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.chprog { display: grid; gap: 3px; margin-top: 4px; }
.chprog .pbar i { background: var(--subj, var(--accent)); }
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.qnav button { min-height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-variant-numeric: tabular-nums; color: var(--fg); font: inherit; font-size: 13px; }
.qnav button.ans { background: var(--accent-soft); border-color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.qnav button.ok { background: var(--good-soft); border-color: var(--good); }
.qnav button.ng { background: var(--bad-soft); border-color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--fg); color: var(--bg); }
.timer.low { background: var(--bad); color: #fff; }
.opt.pick { border-color: var(--accent); background: var(--accent-soft); }
.radios { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.radios label { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 14px; }
table.mini th, table.mini td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.mini td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.mini th, table.mini td a { white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.subjtabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.subjtabs button { display: grid; gap: 2px; justify-items: center; padding: 10px 6px 8px; min-height: 60px; border: 1px solid var(--line); border-top: 4px solid var(--subj); border-radius: 12px; background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.subjtabs button .nm { font-weight: 700; font-size: 15px; }
.subjtabs button .pc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.subjtabs button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); border-top-color: var(--subj); box-shadow: inset 0 0 0 1px var(--accent); }
.subjtabs button[aria-selected="true"] .nm { color: var(--accent); }
@media (max-width: 640px) { .subjtabs { grid-template-columns: repeat(3, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 13px; color: var(--muted); }
.daychart { position: relative; display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 160px; border-bottom: 1px solid var(--line); padding-top: 18px; }
.daycol { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; border: 0; background: transparent; padding: 0; cursor: default; }
.daycol .bar { width: 70%; max-width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
.daycol .tip { display: none; position: absolute; bottom: calc(100% - 14px); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 2; pointer-events: none; }
.daycol:hover .tip, .daycol:focus .tip { display: block; }
.daycol.l .tip { left: 0; transform: none; }
.daycol.r .tip { left: auto; right: 0; transform: none; }
.daycol:hover .bar, .daycol:focus .bar { filter: brightness(1.15); }
.daylabels { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.ymax { position: absolute; top: 0; left: 0; font-size: 11px; color: var(--muted); }
.hbar { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 8px 10px; align-items: center; font-size: 14px; }
.hbar .track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 5px 5px 0; }
.hbar .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field select { padding: 8px 10px; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--sunk); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .face { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">FIT重點複習</a>
    <nav class="tabs" id="tabs" aria-label="主要頁面">
      <a href="#home">科目</a>
      <a href="#practice">練習</a>
      <a href="#saved">收藏</a>
      <a href="#wrong">錯題</a>
      <a href="#stats">統計</a>
      <a href="#about">說明</a>
    </nav>
    <button class="themebtn" id="themeBtn" type="button" data-act="theme" aria-label="顯示模式：跟隨系統（點擊切換）" title="顯示模式：跟隨系統"><span aria-hidden="true">◐</span></button>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
"use strict";
// ============ 資料來源（只放已找到的官方頁面；條文內容一律「待核對」） ============
const SRC = {
  bills: { name: "全國法規資料庫：票據法", url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380028" },
  bank: { name: "全國法規資料庫：銀行法", url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380001" },
  cbc: { name: "中央銀行全球資訊網", url: "https://www.cbc.gov.tw/" },
  ias2: { name: "IFRS 基金會：IAS 2 存貨", url: "https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/" },
  ias7: { name: "IFRS 基金會：IAS 7 現金流量表", url: "https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/" },
};
// 涉及現行法規或制度的重點：reg = [來源鍵]；checked = 核對日期（未核對為 null → 顯示「待核對」）
const P = (t, reg) => (reg ? { t, reg, checked: null } : { t });

// ============ 內容（全部為自行整理的重點與自編題目，非歷屆真題） ============
const SUBJECTS = [
{
  key: "acc", name: "會計學", color: "var(--acc)",
  chapters: [
  {
    id: "acc1", title: "會計恆等式與財務報表",
    core: [
      P("會計恆等式：資產 = 負債 + 權益。每一筆交易記錄後，等式兩邊仍然相等。"),
      P("四大財務報表：資產負債表（某一時點的財務狀況）、綜合損益表（一段期間的經營績效）、權益變動表、現金流量表（營業、投資、籌資三類活動）。"),
      P("應計基礎：收入在賺得時認列、費用在發生時認列，不看現金何時收付。"),
    ],
    exam: [
      P("判斷交易對恆等式的影響：以現金償還應付帳款 → 資產減少、負債減少，權益不變。"),
      P("收入使權益增加、費用使權益減少；發放股利是盈餘分配，使權益減少，但不是費用。"),
      P("現金流量分類：購買機器設備屬投資活動；舉借長期借款、發行股票屬籌資活動；收取貨款、支付薪資屬營業活動。利息與股利的分類在 IFRS 下有選擇空間，作答前先看題目給的政策。", ["ias7"]),
    ],
    confuse: [
      P("預收收入（先收錢、尚未提供商品或勞務）是負債，不是收入；預付費用（先付錢、尚未耗用）是資產。"),
      P("資產負債表描述「時點」，損益表描述「期間」；題目問「期末餘額」看資產負債表，問「本期發生數」看損益表。"),
      P("應付費用是負債，與預付費用（資產）方向相反。"),
    ],
    example: [
      P("公司 1 月 1 日預收 3 個月服務費 $30,000：收款時「借：現金 30,000／貸：預收收入 30,000」；1 月底提供一個月服務，「借：預收收入 10,000／貸：服務收入 10,000」。"),
    ],
    cards: [
      ["會計恆等式是什麼？", "資產 = 負債 + 權益"],
      ["預收收入屬於哪一類科目？", "負債（尚未提供商品或勞務）"],
      ["以現金購買機器設備，在現金流量表屬於？", "投資活動"],
      ["發放現金股利對權益的影響？", "權益減少（屬盈餘分配，不是費用）"],
    ],
    quiz: [
      { q: "公司以現金 $5,000 償還應付帳款，對會計恆等式的影響為何？", o: ["資產減少、權益減少", "資產減少、負債減少", "資產與負債皆不變", "負債增加、權益減少"], a: 1, e: "現金（資產）減少 $5,000，應付帳款（負債）同時減少 $5,000，權益不受影響。" },
      { q: "下列何者屬於負債？", o: ["預付租金", "應收帳款", "預收貨款", "存貨"], a: 2, e: "預收貨款是已收款但尚未交貨的義務，屬負債；預付租金、應收帳款、存貨都是資產。" },
    ],
  },
  {
    id: "acc2", title: "存貨與折舊",
    core: [
      P("存貨成本公式常見三種：先進先出法、加權平均法、個別認定法。"),
      P("銷貨成本 = 期初存貨 + 本期進貨 − 期末存貨。"),
      P("折舊是把資產成本（扣除估計殘值後）在耐用年限內有系統地分攤為費用，不是估計資產的市價。直線法每年折舊 =（成本 − 殘值）÷ 耐用年限。"),

// ============ 保存：登入 claude.ai 時存到個人帳號；否則存在本瀏覽器 ============
const LS_KEY = "four-subject-review-v1";
const empty = () => ({ v: 1, saved: {}, wrong: {}, done: {}, att: {}, exams: [], daily: {}, updatedAt: 0 });
let state = empty();
const cloud = { ref: null, status: "local" };
let saveTimer = null, saving = false, again = false;

function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.v === 1) state = Object.assign(empty(), s); } catch (e) {}
}
function persist() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (cloud.ref) { clearTimeout(saveTimer); saveTimer = setTimeout(push, 1200); }
}
async function push() {
  if (!cloud.ref) return;
  if (saving) { again = true; return; }
  saving = true;
  try { await cloud.ref.set({ json: JSON.stringify(state), updatedAt: state.updatedAt }); cloud.status = "synced"; }
  catch (e) { cloud.status = "error"; }
  saving = false; showSync();
  if (again) { again = false; push(); }
}
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    cloud.status = "loading"; showSync();
    const ref = db.collection("data/users/" + id).doc("review");
    const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(() => r(new Error("timeout")), 10000))]);
    cloud.ref = ref;
    const d = snap.exists ? snap.data() : null;
    if (d && typeof d.json === "string" && (d.updatedAt || 0) > state.updatedAt) {
      const s = JSON.parse(d.json);
      if (s && s.v === 1) { state = Object.assign(empty(), s); try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} render(); }
    } else if (state.updatedAt && (!d || (d.updatedAt || 0) < state.updatedAt)) { push(); }
    cloud.status = "synced"; showSync();
  } catch (e) { cloud.status = "error"; showSync(); }
}
function syncText() {
  return {
    local: "收藏與錯題保存在這個瀏覽器；清除瀏覽器資料或換裝置後不會保留。",
    loading: "正在讀取你帳號中的收藏與錯題…",
    synced: "收藏與錯題已保存到你的 claude.ai 帳號（僅你本人可見），換裝置也看得到。",
    error: "暫時無法保存到帳號，紀錄先保存在這個瀏覽器。",
  }[cloud.status];
}
function showSync() { document.querySelectorAll("[data-sync]").forEach((el) => (el.textContent = syncText())); }

  if (!p.reg) return "";
  const links = p.reg.map((k) => `<a href="${SRC[k].url}" target="_blank" rel="noopener">${esc(SRC[k].name)}</a>`).join("・");
  return `<div class="src">${p.checked ? `<span class="chip self">已核對 ${esc(p.checked)}</span>` : `<span class="chip pending">待核對</span>`}<span>來源：${links}</span><span>核對日期：${p.checked ? esc(p.checked) : "—"}</span></div>`;
}
function pointHtml(ch, sec, i, p) {
  const id = `${ch.id}:${sec}:${i}`;
  const on = !!state.saved[id];
  return `<div class="point"><p class="txt">${esc(p.t)}</p>
    <button class="star" data-act="save" data-id="${id}" aria-pressed="${on}" aria-label="${on ? "取消收藏" : "加入收藏"}" title="${on ? "取消收藏" : "加入收藏"}">${on ? "★" : "☆"}</button>
    ${srcHtml(p)}</div>`;
}

// ============ 進度 ============
function chapterProgress(ch) {
  const att = state.att || {};
  let done = 0, ok = 0;
  ch.quiz.forEach((_, i) => { const v = att[`${ch.id}:${i}`]; if (v !== undefined) { done++; if (v === 1) ok++; } });
  return { done, ok, total: ch.quiz.length };
}
function subjectProgress(sub) {
  return sub.chapters.reduce((a, c) => { const p = chapterProgress(c); return { ok: a.ok + p.ok, total: a.total + p.total }; }, { ok: 0, total: 0 });
}
// ============ 合格標準：各科練習、模擬測驗皆需答對 70% ============
const PASS_PCT = 70;
function passNeed(total) { return Math.ceil((total * PASS_PCT) / 100); }
function isPass(right, total) { return total > 0 && right >= passNeed(total); }
function passChip(right, total) { return isPass(right, total) ? `<span class="chip pass">✓ 合格</span>` : `<span class="chip fail">✗ 未合格</span>`; }
function verdictHtml(right, total, note = "") {
  if (!total) return "";
  const need = passNeed(total), pct = Math.round((right / total) * 100);
  return isPass(right, total)
    ? `<p class="passbox pass" role="status"><b>✓ 合格</b>答對 ${right}／${total} 題（${pct}%），達到合格標準：答對 ${PASS_PCT}%（${need} 題）。${note}</p>`
    : `<p class="passbox fail" role="status"><b>✗ 未合格</b>答對 ${right}／${total} 題（${pct}%），合格標準為答對 ${PASS_PCT}%（${need} 題），還差 ${need - right} 題。${note}</p>`;
}
function progHtml(p, label = true) {
  const w = p.total ? (p.ok / p.total) * 100 : 0;
  return `<div class="chprog">${label ? `<span class="small muted">答對 ${p.ok}／${p.total} 題・已練 ${p.done}／${p.total}・合格需 ${passNeed(p.total)} 題${isPass(p.ok, p.total) ? `　<span class="chip pass">✓ 已達合格</span>` : ""}</span>` : ""}
    <div class="pbar" role="progressbar" aria-label="答對進度" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.ok}"><i style="width:${w}%"></i></div></div>`;
}

function quizSummary(ch) {
  let answered = 0, right = 0;
  ch.quiz.forEach((q, k) => { const c = ui.answers[`${ch.id}:${k}`]; if (c !== undefined) { answered++; if (c === q.a) right++; } });
  return `已作答 ${answered}／${ch.quiz.length} 題・答對 ${right} 題` + (answered === ch.quiz.length ? `（正確率 ${Math.round((right / answered) * 100)}%）` : `・合格標準：答對 ${PASS_PCT}%（${passNeed(ch.quiz.length)} 題）`);
}
function quizVerdict(ch) {
  let answered = 0, right = 0;
  ch.quiz.forEach((q, k) => { const c = ui.answers[`${ch.id}:${k}`]; if (c !== undefined) { answered++; if (c === q.a) right++; } });
  return answered === ch.quiz.length ? verdictHtml(right, ch.quiz.length) : "";
}

function permFor(key, n) {
  if (!ui.perm[key]) {
    const a = [...Array(n).keys()];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    ui.perm[key] = a;
  }
  return ui.perm[key];
}

function quizHtml(ch, q, i) {
  const key = `${ch.id}:${i}`;
  const chosen = ui.answers[key];
  const done = chosen !== undefined;
  const perm = permFor(key, q.o.length); // 顯示順序隨機，避免答案集中在固定選項
  const ansPos = perm.indexOf(q.a);
  const opts = perm.map((k, pos) => {
    let cls = "";
    if (done && k === q.a) cls = "right"; else if (done && k === chosen) cls = "wrong";
    return `<button class="opt ${cls}" data-act="answer" data-k="${key}" data-i="${k}" ${done ? "disabled" : ""}><b>(${KEYS[pos]})</b><span>${esc(q.o[k])}</span></button>`;
  }).join("");
  return `<div class="sec" style="gap:10px">
    <div class="row"><span class="chip self">自編練習題</span><span class="small muted">第 ${i + 1} 題</span></div>
    <p style="font-weight:500">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${done ? `<div class="explain"><p class="verdict ${chosen === q.a ? "ok" : "no"}">${chosen === q.a ? "答對了" : "答錯了"}　答案：(${KEYS[ansPos]}) ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></div>` : ""}
  </div>`;
}

const SESS_KEY = LS_KEY + "-session";
const PREF_KEY = LS_KEY + "-practice-prefs";
const MODE_LABEL = { random: "跨章節隨機練習", wrong: "只練錯題", retry: "重練本次答錯的題目" };
function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function qOf(key) { const [cid, i] = String(key).split(":"); const ch = CHAPTERS.get(cid); const q = ch && ch.quiz[Number(i)]; return q ? { ch, q, i: Number(i) } : null; }
function poolKeys(subjKeys) { const out = []; SUBJECTS.forEach((s) => { if (subjKeys.includes(s.key)) s.chapters.forEach((c) => c.quiz.forEach((_, i) => out.push(`${c.id}:${i}`))); }); return out; }
function wrongKeys(subjKeys) { return Object.keys(state.wrong).filter((k) => { const x = qOf(k); return x && subjKeys.includes(x.ch.subject.key); }); }

function sessPerm(key, n) {
  const s = ui.sess;
  if (!s.perm[key]) s.perm[key] = shuffleArr([...Array(n).keys()]);
  return s.perm[key];
}

function sessStats() {
  const s = ui.sess; let answered = 0, right = 0;
  s.keys.forEach((k) => { const c = s.answers[k]; if (c !== undefined) { answered++; if (c === qOf(k).q.a) right++; } });
  return { answered, right, total: s.keys.length };
}

  const done = chosen !== undefined;

function recordAnswer(key, i) {
  const q = qOf(key).q;
  state.att = state.att || {};
  state.att[key] = i === q.a ? 1 : 0;
  state.daily = state.daily || {};
  const dk = dayKey(Date.now());
  const d = state.daily[dk] || (state.daily[dk] = { n: 0, ok: 0 });
  d.n++; if (i === q.a) d.ok++;
  const days = Object.keys(state.daily).sort();
  if (days.length > 90) days.slice(0, days.length - 90).forEach((k) => delete state.daily[k]);
  if (i === q.a) { if (state.wrong[key]) delete state.wrong[key]; }
  else { const w = state.wrong[key]; state.wrong[key] = { n: (w ? w.n : 0) + 1, chosen: i, last: Date.now() }; }
}

const EXAM_KEY = LS_KEY + "-exam";
const fmtDate = (t) => { const d = new Date(t); const p = (n) => String(n).padStart(2, "0"); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtDur = (sec) => `${Math.floor(sec / 60)} 分 ${String(sec % 60).padStart(2, "0")} 秒`;
const fmtClock = (sec) => { const m = Math.floor(sec / 60), x = sec % 60; return `${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
function saveExam() { try { if (ui.exam) localStorage.setItem(EXAM_KEY, JSON.stringify(ui.exam)); else localStorage.removeItem(EXAM_KEY); } catch (e) {} }
function loadExam() { try { const v = JSON.parse(localStorage.getItem(EXAM_KEY) || "null"); if (v && Array.isArray(v.keys) && v.keys.every((k) => qOf(k))) ui.exam = v; } catch (e) {} }

/** 依章節平均分配題數（每章不超過該章題數），再從各章隨機抽題 */
function buildExamKeys(sub, count) {
  const chs = sub.chapters;
  const base = Math.floor(count / chs.length);
  let extra = count - base * chs.length;
  const order = shuffleArr(chs.map((_, i) => i));
  const per = chs.map(() => base);
  for (const i of order) { if (extra <= 0) break; per[i]++; extra--; }
  const keys = [];
  chs.forEach((c, i) => { shuffleArr(c.quiz.map((_, k) => k)).slice(0, Math.min(per[i], c.quiz.length)).forEach((k) => keys.push(`${c.id}:${k}`)); });
  return shuffleArr(keys);
}

function startExam(subKey, count, minutes) {
  const sub = SUBJECTS.find((s) => s.key === subKey);
  const keys = buildExamKeys(sub, count);
  ui.exam = {
    subject: subKey, title: `${sub.name}・整科模擬測驗`, keys, idx: 0, answers: {}, perm: {},
    startedAt: Date.now(), limitMin: minutes, deadline: minutes ? Date.now() + minutes * 60000 : null, done: false, confirm: false,
  };
  saveExam();
  if (location.hash !== "#exam") location.hash = "exam"; else viewExam();
}

function examLeft() { const x = ui.exam; return x && x.deadline ? Math.max(0, Math.ceil((x.deadline - Date.now()) / 1000)) : null; }

function submitExam(auto) {
  const x = ui.exam; if (!x || x.done) return;
  let right = 0;
  x.keys.forEach((k) => {
    const c = x.answers[k];
    if (c === undefined) return; // 未作答：計為答錯，但不加入錯題清單
    if (c === qOf(k).q.a) right++;
    recordAnswer(k, c);
  });
  x.done = true; x.auto = !!auto; x.submittedAt = Date.now();
  x.used = Math.round((Math.min(x.submittedAt, x.deadline || x.submittedAt) - x.startedAt) / 1000);
  x.right = right; x.score = Math.round((right / x.keys.length) * 100);
  state.exams = (state.exams || []).concat([{ at: x.submittedAt, name: SUBJECTS.find((s) => s.key === x.subject).name, right, total: x.keys.length, score: x.score, used: x.used }]).slice(-20);
  persist(); saveExam();
}

        <p class="small"><a href="#ch-${ch.id}" style="color:${ch.subject.color}">第 ${ch.no} 章・${esc(ch.title)}</a></p>
        <p style="font-weight:500">${esc(q.q)}</p>
        <p class="small">你的答案：${c === undefined ? "（未作答）" : esc(q.o[c])}</p>
        <div class="explain"><p class="verdict ok">正確答案：${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></div>
      </section>`; }).join("") : `<div class="card empty">全部答對！</div>`}`;
  window.scrollTo(0, 0);
}

// ============ 學習統計 ============
function dayKey(t) { const d = new Date(t); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function lastDays(n) { const out = []; const now = new Date(); for (let i = n - 1; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); out.push(dayKey(d.getTime())); } return out; }
function streakDays() {
  const daily = state.daily || {};
  let n = 0; const now = new Date();
  // 今天還沒練習時，從昨天開始算
  let i = daily[dayKey(now.getTime())] ? 0 : 1;
  for (;; i++) { const k = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i).getTime()); if (daily[k] && daily[k].n) n++; else break; }
  return n;
}

function viewStats() {
  const att = state.att || {};
  const total = [...CHAPTERS.values()].reduce((a, c) => a + c.quiz.length, 0);
  const done = Object.keys(att).filter((k) => qOf(k)).length;
  const ok = Object.keys(att).filter((k) => qOf(k) && att[k] === 1).length;
  const exams = state.exams || [];
  const avg = exams.length ? Math.round(exams.reduce((a, x) => a + x.score, 0) / exams.length) : null;
  const best = exams.length ? Math.max(...exams.map((x) => x.score)) : null;
  const days = lastDays(14);
  const daily = state.daily || {};
  const vals = days.map((d) => (daily[d] ? daily[d] : { n: 0, ok: 0 }));
  const max = Math.max(1, ...vals.map((v) => v.n));
  const sum14 = vals.reduce((a, v) => a + v.n, 0);
  const activeDays = vals.filter((v) => v.n).length;
  const weak = [...CHAPTERS.values()].map((c) => ({ c, p: chapterProgress(c) })).filter((x) => x.p.done >= 3)
    .map((x) => ({ ...x, rate: x.p.ok / x.p.done })).sort((a, b) => a.rate - b.rate || b.p.done - a.p.done).slice(0, 5);
  const untouched = [...CHAPTERS.values()].filter((c) => chapterProgress(c).done === 0).length;
  const pctTxt = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "—");

  $app.innerHTML = `
    <h1>學習統計</h1>
    <p class="muted small">依每題最近一次作答結果計算；章節練習、跨章節練習與模擬測驗都會計入。</p>
    <section class="tiles" aria-label="總覽">
      <div class="tile"><b>${done}<small class="muted" style="font-size:14px">／${total}</small></b><span>已練題數</span></div>
      <div class="tile"><b>${ok}</b><span>目前答對題數</span></div>
      <div class="tile"><b>${pctTxt(ok, done)}</b><span>正確率（已練題目）</span></div>
      <div class="tile"><b>${Object.keys(state.wrong).length}</b><span>錯題清單</span></div>
      <div class="tile"><b>${streakDays()} 天</b><span>連續學習</span></div>
      <div class="tile"><b>${avg === null ? "—" : avg + " 分"}</b><span>模擬測驗平均（${exams.length} 次）</span></div>
    </section>

    <section class="card">
      <div class="row"><h2>近 14 天作答題數</h2><span class="spacer"></span><span class="small muted">共 ${sum14} 題・${activeDays} 天有練習</span></div>
      ${sum14 ? `
      <div class="daychart" role="img" aria-label="近 14 天每日作答題數長條圖，最多 ${max} 題">
        <span class="ymax">${max} 題</span>
        ${days.map((d, i) => { const v = vals[i]; const h = (v.n / max) * 100; return `<button class="daycol ${i < 4 ? "l" : i > 9 ? "r" : ""}" type="button" aria-label="${d.slice(5).replace("-", "/")}：作答 ${v.n} 題，答對 ${v.ok} 題"><span class="bar" style="height:${h}%"></span><span class="tip">${d.slice(5).replace("-", "/")}・作答 ${v.n}・答對 ${v.ok}</span></button>`; }).join("")}
      </div>
      <div class="daylabels" aria-hidden="true">${days.map((d, i) => `<span>${i % 2 === 1 || i === days.length - 1 ? d.slice(5).replace("-", "/") : ""}</span>`).join("")}</div>
      <details class="small"><summary>以表格檢視</summary>
        <div class="tablewrap"><table class="mini"><thead><tr><th>日期</th><th>作答</th><th>答對</th><th>正確率</th></tr></thead><tbody>
          ${days.map((d, i) => `<tr><td class="num">${d}</td><td class="num">${vals[i].n}</td><td class="num">${vals[i].ok}</td><td class="num">${pctTxt(vals[i].ok, vals[i].n)}</td></tr>`).join("")}
        </tbody></table></div>
      </details>` : `<div class="empty">近 14 天還沒有作答紀錄。到任一章節的「練習題」或「練習」頁開始作答，這裡就會出現每日題數。</div>`}
    </section>

    <section class="card">
      <h2>各科進度</h2>
      <p class="small muted">長條為答對題數占全科題數的比例。</p>
      <div style="display:grid;gap:12px">
        ${SUBJECTS.map((sub) => { const sp = subjectProgress(sub); const dn = sub.chapters.reduce((a, c) => a + chapterProgress(c).done, 0); return `
          <div class="hbar">
            <span>${sub.name}</span>
            <div class="track" role="progressbar" aria-label="${sub.name} 答對進度" aria-valuemin="0" aria-valuemax="${sp.total}" aria-valuenow="${sp.ok}"><i style="width:${(sp.ok / sp.total) * 100}%"></i></div>
            <span class="num">${sp.ok}／${sp.total}</span>
          </div>
          <p class="small muted" style="margin-top:-8px">已練 ${dn} 題・正確率 ${pctTxt(sp.ok, dn)}</p>`; }).join("")}
      </div>
    </section>

    <section class="card">
      <h2>需要加強的章節</h2>
      ${weak.length ? `<p class="small muted">已練 3 題以上的章節中，正確率最低的 ${weak.length} 章。</p>
        <div class="tablewrap"><table class="mini"><thead><tr><th>章節</th><th>正確率</th><th>已練</th><th></th></tr></thead><tbody>
          ${weak.map((x) => `<tr><td>${x.c.subject.name}・第 ${x.c.no} 章 ${esc(x.c.title)}</td><td class="num">${Math.round(x.rate * 100)}%</td><td class="num">${x.p.done}／${x.p.total}</td><td><a href="#ch-${x.c.id}">去複習</a></td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">累積更多作答後（每章至少 3 題），這裡會列出正確率最低的章節。</div>`}
      <p class="small muted">尚未開始練習的章節：${untouched}／${CHAPTERS.size} 章。</p>
    </section>

    <section class="card">
      <div class="row"><h2>模擬測驗紀錄</h2><span class="spacer"></span>${exams.length ? `<span class="small muted">平均 ${avg} 分・最高 ${best} 分・合格 ${exams.filter((x) => isPass(x.right, x.total)).length}／${exams.length} 次</span>` : ""}</div>
      ${exams.length ? `<div style="display:grid;gap:10px">
        ${exams.slice().reverse().map((x) => `
          <div class="hbar" style="grid-template-columns: 9.5em 1fr auto">
            <span class="small">${fmtDate(x.at)} ${esc(x.name)}</span>
            <div class="track" role="img" aria-label="${x.score} 分"><i style="width:${x.score}%"></i></div>
            <span class="num">${x.score} 分（${x.right}/${x.total}） ${passChip(x.right, x.total)}</span>
          </div>`).join("")}
        </div>` : `<div class="empty">還沒有模擬測驗紀錄。<a href="#practice">到「練習」頁開始整科模擬測驗</a>。</div>`}
    </section>
    <p class="syncnote" data-sync>${syncText()}</p>`;
  window.scrollTo(0, 0);
}

// ============ 事件 ============
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const h = (location.hash || "").slice(1);
  if (act === "theme") { const cur = getThemePref(); const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length]; setThemePref(next); return; }
  if (act === "themeset") { setThemePref(el.dataset.v); return; }
  if (act === "homesubj") { setHomeSubject(el.dataset.v); viewHome(); const t = document.getElementById("tab-" + el.dataset.v); if (t) t.focus(); return; }
  if (act === "tab") { ui.tab = el.dataset.v; viewChapter(h.slice(3)); return; }
  if (act === "save") {
    const id = el.dataset.id;
    if (state.saved[id]) delete state.saved[id]; else state.saved[id] = Date.now();
    persist();
    const on = !!state.saved[id];
    if (h === "saved") { viewSaved(); return; }
    el.setAttribute("aria-pressed", on); el.textContent = on ? "★" : "☆";
    el.setAttribute("aria-label", on ? "取消收藏" : "加入收藏"); el.title = on ? "取消收藏" : "加入收藏";
    return;
  }
  if (act === "flip") { const k = el.dataset.k; ui.flipped[k] = !ui.flipped[k]; const box = el.closest(".flip"); box.classList.toggle("on", ui.flipped[k]); return; }
  if (act === "flipall") { Object.keys(ui.flipped).forEach((k) => { if (k.startsWith(el.dataset.ch + ":")) delete ui.flipped[k]; }); viewChapter(el.dataset.ch); return; }
  if (act === "answer") {
    const key = el.dataset.k; const i = Number(el.dataset.i);
    if (ui.answers[key] !== undefined) return;
    ui.answers[key] = i;
    const [cid, qi] = key.split(":"); const ch = CHAPTERS.get(cid); const q = ch.quiz[qi];
    recordAnswer(key, i);
    const cp = document.getElementById("chprog"); if (cp) cp.innerHTML = progHtml(chapterProgress(ch));
    const answered = ch.quiz.filter((_, k) => ui.answers[`${cid}:${k}`] !== undefined);
    if (answered.length === ch.quiz.length) state.done[cid] = { correct: ch.quiz.filter((qq, k) => ui.answers[`${cid}:${k}`] === qq.a).length, total: ch.quiz.length, at: Date.now() };
    persist();
    const wrap = el.closest(".sec"); const tmp = document.createElement("div"); tmp.innerHTML = quizHtml(ch, q, Number(qi)); wrap.replaceWith(tmp.firstElementChild);
    const sum = document.getElementById("qsum"); if (sum) sum.textContent = quizSummary(ch);
    const qv = document.getElementById("qverdict"); if (qv) qv.innerHTML = quizVerdict(ch);
    return;
  }
  if (act === "resetquiz") { Object.keys(ui.answers).forEach((k) => { if (k.startsWith(el.dataset.ch + ":")) delete ui.answers[k]; }); viewChapter(el.dataset.ch); return; }
  if (act === "startrandom") {
    const subj = selectedSubjects("rp");
    const count = Number(document.getElementById("rp-count").value) || 20;
    if (!subj.length) { document.getElementById("rp-msg").textContent = "請至少選擇一個科目。"; return; }
    savePrefs({ subjects: subj, count });
    const pool = poolKeys(subj);
    startSess("random", shuffleArr(pool).slice(0, Math.min(count, pool.length)), `跨章節隨機練習（${subjNames(subj)}）`);
    return;
  }
  if (act === "startwrongsel") {
    const subj = selectedSubjects("wp");
    if (!subj.length) { document.getElementById("wp-msg").textContent = "請至少選擇一個科目。"; return; }
    const keys = wrongKeys(subj);
    if (!keys.length) { document.getElementById("wp-msg").textContent = "所選科目目前沒有錯題。"; return; }
    startSess("wrong", shuffleArr(keys), `只練錯題（${subjNames(subj)}）`);
    return;
  }
  if (act === "startwrong") { startSess("wrong", shuffleArr(wrongKeys(SUBJECTS.map((s) => s.key))), "只練錯題（全部科目）"); return; }
  if (act === "sanswer") {
    const s = ui.sess; if (!s) return;
    const key = s.keys[s.idx];
    if (s.answers[key] !== undefined) return;
    const i = Number(el.dataset.i);
    s.answers[key] = i;
    recordAnswer(key, i);
    persist(); saveSess(); viewSession();
    return;
  }
  if (act === "snext") { ui.sess.idx++; saveSess(); viewSession(); window.scrollTo(0, 0); return; }
  if (act === "sprev") { ui.sess.idx--; saveSess(); viewSession(); window.scrollTo(0, 0); return; }
  if (act === "sfinish") { ui.sess.done = true; saveSess(); viewSessResult(); return; }
  if (act === "sretry") { const s = ui.sess; startSess("retry", shuffleArr(s.keys.filter((k) => s.answers[k] !== undefined && s.answers[k] !== qOf(k).q.a)), "重練本次答錯的題目"); return; }
  if (act === "snew") { ui.sess = null; saveSess(); viewPracticeSetup(); return; }
  if (act === "sessquit") { e.preventDefault(); ui.sess.done = true; saveSess(); viewSessResult(); return; }
  if (act === "examstart") {
    const sel = document.querySelector('input[name="ex-subj"]:checked');
    startExam(sel ? sel.value : SUBJECTS[0].key, Number(document.getElementById("ex-count").value) || 50, Number(document.getElementById("ex-time").value) || 0);
    return;
  }
  if (act === "expick") { const x = ui.exam; if (!x || x.done) return; if (x.deadline && Date.now() >= x.deadline) { submitExam(true); viewExamResult(); return; } x.answers[x.keys[x.idx]] = Number(el.dataset.i); x.confirm = false; saveExam(); viewExam(); return; }
  if (act === "exprev") { ui.exam.idx--; ui.exam.confirm = false; saveExam(); viewExam(); window.scrollTo(0, 0); return; }
  if (act === "exnext") { ui.exam.idx++; ui.exam.confirm = false; saveExam(); viewExam(); window.scrollTo(0, 0); return; }
  if (act === "exgo") { ui.exam.idx = Number(el.dataset.i); ui.exam.confirm = false; saveExam(); viewExam(); window.scrollTo(0, 0); return; }
  if (act === "exsubmit") { const x = ui.exam; if (Object.keys(x.answers).length < x.keys.length) { x.confirm = true; viewExam(); return; } submitExam(false); viewExamResult(); return; }
  if (act === "exsubmityes") { submitExam(false); viewExamResult(); return; }
  if (act === "exsubmitno") { ui.exam.confirm = false; viewExam(); return; }
  if (act === "exretry") { const x = ui.exam; startSess("retry", shuffleArr(x.keys.filter((k) => x.answers[k] !== undefined && x.answers[k] !== qOf(k).q.a)), "重練模擬測驗答錯的題目"); return; }
  if (act === "exagain") { const x = ui.exam; startExam(x.subject, x.keys.length, x.limitMin); return; }
  if (act === "install") { if (window.__installPrompt) { window.__installPrompt.prompt(); window.__installPrompt = null; const r = document.getElementById("installRow"); if (r) r.hidden = true; } return; }
  if (act === "clear") { document.getElementById("clearConfirm").hidden = false; return; }
  if (act === "clearno") { document.getElementById("clearConfirm").hidden = true; return; }
  if (act === "clearyes") { state = empty(); ui.answers = {}; ui.sess = null; ui.exam = null; saveSess(); saveExam(); persist(); viewAbout(); return; }
});
window.addEventListener("hashchange", () => {
  const h = (location.hash || "").slice(1);
  if (h.startsWith("ch-")) { ui.tab = "points"; }
  if (h === "wrong") { Object.keys(state.wrong).forEach((k) => delete ui.answers[k]); }
  render();
});

// ============ 顯示模式（跟隨系統／淺色／深色） ============
const THEME_KEY = LS_KEY + "-theme";
const THEME_ORDER = ["system", "light", "dark"];
const THEME_LABEL = { system: "跟隨系統", light: "淺色", dark: "深色" };
const THEME_ICON = { system: "◐", light: "☀", dark: "☾" };
function getThemePref() { try { const v = localStorage.getItem(THEME_KEY); return THEME_ORDER.includes(v) ? v : "system"; } catch (e) { return "system"; } }
function applyTheme(pref) {
  const root = document.documentElement;
  if (pref === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", pref);
  const dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#111613" : "#2d5f4a");
  const btn = document.getElementById("themeBtn");
  if (btn) {
    btn.firstElementChild.textContent = THEME_ICON[pref];
    btn.setAttribute("aria-label", `顯示模式：${THEME_LABEL[pref]}（點擊切換）`);
    btn.title = `顯示模式：${THEME_LABEL[pref]}`;
  }
  document.querySelectorAll("[data-act=themeset]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === pref));
}
function setThemePref(pref) { try { localStorage.setItem(THEME_KEY, pref); } catch (e) {} applyTheme(pref); }
if (window.matchMedia) { const mq = window.matchMedia("(prefers-color-scheme: dark)"); const onChange = () => { if (getThemePref() === "system") applyTheme("system"); }; if (mq.addEventListener) mq.addEventListener("change", onChange); }
applyTheme(getThemePref());

window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__installPrompt = e; const r = document.getElementById("installRow"); if (r) r.hidden = false; });
loadLocal();
loadSess();
loadExam();
render();
initCloud();
</script>
